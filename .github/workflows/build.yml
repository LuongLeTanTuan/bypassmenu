name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  theos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootful, rootless]

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build (${{ matrix.scheme }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            export THEOS_PACKAGE_SCHEME=rootless
          fi
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
          # Fail the job if the dylib was never produced — a green build that
          # emitted nothing is worse than a red one.
          find .theos/obj -name 'QoSMetrics.dylib' -print -quit | grep -q .

      - name: Show artefacts
        run: |
          find .theos/obj -name '*.dylib' -exec ls -lh {} \;
          ls -lh packages/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: QoSMetrics-${{ matrix.scheme }}
          path: |
            packages/*.deb
            .theos/obj/**/QoSMetrics.dylib
          if-no-files-found: error
